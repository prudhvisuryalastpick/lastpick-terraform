name: Infrastructure (plan / apply / destroy)

# Runs Terraform on GitHub's servers, so nothing is installed on your computer.
# Run it from the Actions tab: "Run workflow" -> pick an action.
#   plan    : shows what would be created or changed. Changes nothing.
#   apply   : creates or changes the AWS resources (type "yes" in confirm).
#   destroy : deletes everything, database included (type "destroy" in confirm).
# Needs the repo secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY and the repo variable ALERT_EMAIL.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply or destroy"
        type: choice
        options: [plan, apply, destroy, diagnose]
        default: plan
      confirm:
        description: 'Type "yes" for apply, "destroy" for destroy'
        required: false
        default: ""

concurrency: infra   # never two Terraform runs at once

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-south-1
      TF_IN_AUTOMATION: "1"
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL || 'prudhvisuryalastpick@gmail.com' }}
      # test setup: false lets "destroy" remove everything, database included
      TF_VAR_protect_data: ${{ vars.PROTECT_DATA || 'false' }}
      TF_VAR_domain_ready: ${{ vars.DOMAIN_READY || 'false' }}
      # read replica off for now (creation kept failing while the main database was busy); set repo variable DB_READ_REPLICA=true to add it
      TF_VAR_db_read_replica: ${{ vars.DB_READ_REPLICA || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check settings
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::Add the repo secret AWS_ACCESS_KEY_ID"; exit 1; }
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || { echo "::error::Add the repo secret AWS_SECRET_ACCESS_KEY"; exit 1; }
          [ -n "$TF_VAR_alert_email" ] || { echo "::error::Add the repo variable ALERT_EMAIL"; exit 1; }
          if [ "${{ inputs.action }}" = apply ] && [ "${{ inputs.confirm }}" != yes ]; then echo "::error::Type yes in confirm to apply"; exit 1; fi
          if [ "${{ inputs.action }}" = destroy ] && [ "${{ inputs.confirm }}" != destroy ]; then echo "::error::Type destroy in confirm to destroy"; exit 1; fi

      - name: State bucket (created once)
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lastpick-terraform-state-$ACCOUNT"
          echo "BUCKET=$BUCKET" >> "$GITHUB_ENV"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint=ap-south-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

      - name: Init
        run: terraform init -input=false -backend-config="bucket=$BUCKET" -backend-config="key=lastpick/terraform.tfstate" -backend-config="region=ap-south-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Diagnose (read-only)
        if: inputs.action == 'diagnose'
        run: |
          for svc in customer partner admin; do
            echo "===== $svc: last stopped tasks"
            for t in $(aws ecs list-tasks --cluster lastpick --service-name $svc --desired-status STOPPED --max-items 2 --query 'taskArns[]' --output text | grep -v None); do
              aws ecs describe-tasks --cluster lastpick --tasks $t --query 'tasks[].{created:createdAt,taskDef:taskDefinitionArn,stopped:stoppedReason,containers:containers[].{exit:exitCode,image:image,digest:imageDigest}}' --output json
            done
            echo "===== $svc: last log lines"
            aws logs filter-log-events --log-group-name /lastpick/$svc --start-time $(( ($(date +%s) - 3600) * 1000 )) --limit 40 --query 'events[].message' --output text 2>&1 | tr '\t' '\n' | tail -25
          done
          echo "===== images in ECR"
          aws ecr describe-images --repository-name lastpick --query 'reverse(sort_by(imageDetails,&imagePushedAt))[:3].{tags:imageTags,digest:imageDigest,pushed:imagePushedAt}' --output json
          echo "===== customer task definition (image + command)"
          aws ecs describe-task-definition --task-definition lastpick-customer --query 'taskDefinition.{rev:revision,containers:containerDefinitions[].{image:image,command:command,entryPoint:entryPoint,workdir:workingDirectory,mounts:mountPoints}}' --output json

      - name: Plan
        if: inputs.action != 'destroy' && inputs.action != 'diagnose'
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          { echo '### Plan'; echo '```'; grep -E "^Plan:|No changes" plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.action == 'apply'
        run: |
          terraform apply -input=false -auto-approve tfplan
          { echo '### Addresses'; echo '```'; for o in customer_url partner_url admin_url deploy_role_arn; do echo "$o = $(terraform output -raw $o 2>/dev/null)"; done; echo; echo 'DNS records to add at GoDaddy:'; terraform output -json dns_records_to_add 2>/dev/null | jq -r '.[] | "\(.type)  \(.name)  ->  \(.value)   (\(.purpose))"'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          terraform output -json | jq 'with_entries(select(.value.sensitive|not) | .value = .value.value)' > outputs.json

      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -no-color

      - uses: actions/upload-artifact@v4
        if: inputs.action != 'destroy' && inputs.action != 'diagnose'
        with:
          name: terraform-${{ inputs.action }}
          path: |
            plan.txt
            outputs.json
          if-no-files-found: ignore
          retention-days: 14
