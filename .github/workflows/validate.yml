name: Validate Terraform

# Checks formatting and syntax on every push and pull request. Doesn't touch AWS (no credentials needed).
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform fmt -check -recursive -diff || echo "::warning::Run 'terraform fmt -recursive' to tidy the formatting"
      - name: Init (no backend)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
